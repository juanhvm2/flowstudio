<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowStudio — Creador de flujos y estructuras</title>

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="description" content="FlowStudio — Creador visual de flujos, estructuras y diagramas jerárquicos. 74 plantillas para desarrollo, marketing, eventos, diseño y más.">
<meta name="theme-color" content="#0a84ff">
<meta property="og:title" content="FlowStudio">
<meta property="og:description" content="Creador visual de flujos, estructuras y diagramas jerárquicos.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">◈</div>
    <div><div class="brand-t">FlowStudio</div><div class="brand-s">Flujos y estructuras</div></div>
  </div>

  <div class="tpl-wrap" id="tplWrap">
    <button class="tpl-btn" id="tplBtn">
      <span id="tplIcon">📁</span>
      <span id="tplName">Flujo de Carpetas y Archivos</span>
      <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="tpl-menu hidden" id="tplMenu">
      <div class="tpl-search"><input id="tplSearch" placeholder="Buscar entre 55 plantillas y 22 rubros…"></div>
      <div class="tpl-list" id="tplList"></div>
    </div>
  </div>

  <div class="spacer"></div>
  <input class="proj-name" id="projName" value="mi-proyecto" spellcheck="false">

  <div class="file-status" id="fileStatus" title="Estado del proyecto">
    <span class="dot"></span>
    <span class="fname">Sin guardar</span>
  </div>

  <div class="actions">
    <button class="btn ghost" id="btnNew" title="Nuevo (Ctrl+N)">Nuevo</button>
    <button class="btn ghost" id="btnOpen" title="Abrir archivo (Ctrl+O)">Abrir</button>
    <button class="btn ghost" id="btnSave" title="Guardar (Ctrl+S)">Guardar</button>
    <button class="btn ghost" id="btnSaveAs" title="Guardar como (Ctrl+Shift+S)">Guardar como…</button>
    <button class="btn ghost" id="btnProjects" title="Proyectos recientes">Recientes</button>
    <div class="dd">
      <button class="btn primary" id="btnExport">Exportar
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="dd-menu hidden" id="exportMenu">
        <button class="dd-item" data-fmt="ai-json"><span class="di">🤖</span><span>JSON para IA <span class="ai-badge">LLM</span><small>Estructura semántica con metadatos</small></span></button>
        <button class="dd-item" data-fmt="ai-md"><span class="di">🧠</span><span>Markdown para IA <span class="ai-badge">LLM</span><small>Prompt-ready para ChatGPT/Claude</small></span></button>
        <div class="dd-sep"></div>
        <button class="dd-item" data-fmt="json"><span class="di">{ }</span><span>JSON<small>Estructura re-importable</small></span></button>
        <button class="dd-item" data-fmt="md"><span class="di">📝</span><span>Markdown<small>Documento con jerarquía</small></span></button>
        <button class="dd-item" data-fmt="txt"><span class="di">🌳</span><span>Árbol ASCII<small>Texto plano tipo `tree`</small></span></button>
        <button class="dd-item" data-fmt="csv"><span class="di">📊</span><span>CSV<small>Para Excel / Sheets</small></span></button>
        <button class="dd-item" data-fmt="mmd"><span class="di">🧜</span><span>Mermaid<small>Diagrama para docs</small></span></button>
        <button class="dd-item" data-fmt="svg"><span class="di">🖼️</span><span>SVG<small>Imagen vectorial del grafo</small></span></button>
        <button class="dd-item" data-fmt="html"><span class="di">🌐</span><span>HTML<small>Página autónoma navegable</small></span></button>
      </div>
    </div>
    <button class="btn icon" id="btnToggleInspector" title="Descripción del proyecto (Ctrl+I)">📝</button>
    <button class="btn icon" id="btnTheme" title="Tema">🌙</button>
  </div>
</header>

<main class="layout">
  <section class="panel left" id="leftPanel">
    <div class="panel-head">
      <span>Estructura del flujo</span>
      <div class="panel-tools">
        <button id="btnExpandAll" title="Expandir todo">⤢</button>
        <button id="btnCollapseAll" title="Contraer todo">⤡</button>
      </div>
    </div>
    <div class="tree-scroll" id="treeScroll"><div id="tree"></div></div>
    <div class="panel-foot">
      <label>Tipo</label>
      <select id="newTypeSelect"></select>
    </div>
  </section>

  <div class="resizer" id="resizer"></div>

  <section class="panel right">
    <div class="view-head">
      <div class="tabs" id="viewTabs">
        <button class="tab active" data-view="nodes">Nodos</button>
        <button class="tab" data-view="screens">Pantallas</button>
        <button class="tab" data-view="list">Lista</button>
        <button class="tab" data-view="outline">Esquema</button>
        <button class="tab" data-view="json">JSON</button>
        <button class="tab" data-view="markdown">Markdown</button>
      </div>
      <div class="view-extra" id="viewExtra"></div>
    </div>
    <div class="view-body" id="viewBody"></div>
  </section>

  <div class="resizer hidden" id="resizerInspector"></div>

  <aside class="panel inspector hidden" id="inspectorPanel">
    <div class="panel-head">
      <span>Descripción del proyecto</span>
      <div class="panel-tools">
        <button id="btnCopyInspector" title="Copiar texto">📋</button>
        <button id="btnCloseInspector" title="Cerrar">✕</button>
      </div>
    </div>
    <div class="inspector-scroll" id="inspectorBody"></div>
  </aside>
</main>

<div class="toast" id="toast"></div>
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Proyectos guardados</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<input type="file" id="fileInput" accept=".json,.flowstudio,application/json" hidden>
<div class="ctx-menu hidden" id="ctxMenu"></div>
<div class="popover hidden" id="iconPopover"></div>
<div class="popover hidden" id="descPopover"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
