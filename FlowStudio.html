<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowStudio — Creador de flujos y estructuras</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f2f2f7; --bg-2:#fff; --panel:#fff; --panel-2:#fbfbfd;
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#8e8e93;
  --border:rgba(0,0,0,.08); --border-2:rgba(0,0,0,.14);
  --accent:#0071e3; --accent-2:#0077ed; --accent-soft:rgba(0,113,227,.1);
  --hover:rgba(0,0,0,.045); --sel:rgba(0,113,227,.12);
  --shadow-s:0 1px 2px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.04);
  --shadow-m:0 4px 16px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  --shadow-l:0 20px 60px rgba(0,0,0,.18),0 4px 16px rgba(0,0,0,.1);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#000; --bg-2:#0a0a0b; --panel:#1c1c1e; --panel-2:#242426;
  --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#8e8e93;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.18);
  --accent:#0a84ff; --accent-2:#409cff; --accent-soft:rgba(10,132,255,.16);
  --hover:rgba(255,255,255,.06); --sel:rgba(10,132,255,.2);
  --shadow-s:0 1px 2px rgba(0,0,0,.5); --shadow-m:0 4px 16px rgba(0,0,0,.5);
  --shadow-l:0 24px 70px rgba(0,0,0,.7);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s,color .3s}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,140,.35);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,140,.55);background-clip:content-box;border:3px solid transparent}

/* TOPBAR */
.topbar{height:60px;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:color-mix(in srgb,var(--panel) 78%,transparent);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid var(--border);position:relative;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding-right:8px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(150deg,#0a84ff,#5e5ce6 55%,#bf5af2);color:#fff;
  box-shadow:0 4px 14px rgba(10,132,255,.35)}
.brand-t{font-weight:650;font-size:14px;letter-spacing:-.2px;line-height:1.1}
.brand-s{font-size:11px;color:var(--text-3);line-height:1.2;margin-top:2px}
.spacer{flex:1}
.tpl-wrap{position:relative}
.tpl-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--border);font-weight:550;
  box-shadow:var(--shadow-s);transition:.18s;max-width:290px}
.tpl-btn:hover{background:var(--hover);border-color:var(--border-2)}
.tpl-btn .chev{transition:transform .2s;opacity:.5}
.tpl-wrap.open .chev{transform:rotate(180deg)}
.tpl-btn span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-menu{position:absolute;top:46px;left:0;width:430px;max-height:min(75vh,620px);
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);
  border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-l);
  display:flex;flex-direction:column;overflow:hidden;z-index:100;
  animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.tpl-menu.hidden{display:none}
.tpl-search{padding:10px 10px 6px}
.tpl-search input{width:100%;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg);padding:0 12px;outline:none}
.tpl-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tpl-list{overflow-y:auto;padding:4px 8px 10px}
.tpl-group{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--accent);padding:14px 8px 5px;position:sticky;top:0;
  background:linear-gradient(var(--panel),var(--panel) 70%,transparent);z-index:2}
.tpl-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:10px;text-align:left;transition:.12s}
.tpl-item:hover{background:var(--hover)}
.tpl-item.active{background:var(--sel)}
.tpl-item-icon{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;
  font-size:16px;background:var(--bg);border:1px solid var(--border)}
.tpl-item-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.tpl-item-txt b{font-weight:560;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-item-txt small{color:var(--text-3);font-size:11px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}
.tpl-check{color:var(--accent);font-weight:700}

.proj-name{height:34px;width:180px;border-radius:9px;border:1px solid transparent;
  background:transparent;padding:0 10px;font-weight:560;outline:none;transition:.15s}
.proj-name:hover{background:var(--hover)}
.proj-name:focus{background:var(--bg-2);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn{height:34px;padding:0 13px;border-radius:9px;font-weight:550;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn.ghost{background:var(--panel-2);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--hover);border-color:var(--border-2)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(0,113,227,.32)}
.btn.primary:hover{background:var(--accent-2);transform:translateY(-1px)}
.btn.icon{width:34px;padding:0;justify-content:center;background:var(--panel-2);
  border:1px solid var(--border);font-size:15px}
.btn.icon:hover{background:var(--hover)}
.actions{display:flex;align-items:center;gap:7px}
.dd{position:relative}
.dd-menu{position:absolute;top:42px;right:0;min-width:250px;padding:6px;
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-l);z-index:100;
  animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
.dd-menu.hidden{display:none}
.dd-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:9px;font-size:13px;text-align:left;transition:.12s}
.dd-item:hover{background:var(--hover)}
.dd-item .di{width:22px;text-align:center;font-size:14px;opacity:.85}
.dd-item small{display:block;color:var(--text-3);font-size:10.5px;margin-top:1px}
.dd-sep{height:1px;background:var(--border);margin:6px 4px}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 60px);overflow:hidden}
.panel{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.panel.left{width:390px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--border)}
.panel.right{flex:1;background:var(--bg-2)}
.resizer{width:5px;cursor:col-resize;background:transparent;flex:0 0 5px;
  margin-left:-5px;z-index:10;transition:background .2s}
.resizer:hover,.resizer.active{background:var(--accent-soft)}
.panel-head{height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px 0 16px;border-bottom:1px solid var(--border);flex:0 0 auto}
.panel-head>span{font-weight:620;font-size:12.5px;letter-spacing:.2px}
.panel-tools{display:flex;gap:2px}
.panel-tools button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--text-2);font-size:14px;transition:.12s}
.panel-tools button:hover{background:var(--hover);color:var(--text)}
.tree-scroll{flex:1;overflow:auto;padding:8px 8px 20px}
.trow{display:flex;align-items:center;gap:5px;height:30px;border-radius:8px;
  padding-right:6px;cursor:default;transition:background .1s;position:relative}
.trow:hover{background:var(--hover)}
.trow.sel{background:var(--sel)}
.trow.sel .tname{font-weight:600}
.caret{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;
  font-size:9px;color:var(--text-3);border-radius:4px;transition:.12s}
.caret:hover{background:var(--border);color:var(--text)}
.caret.empty{visibility:hidden}
.ticon{width:18px;flex:0 0 18px;text-align:center;font-size:13px;line-height:1;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.08))}
.tname{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname input{width:100%;height:22px;border-radius:6px;border:1px solid var(--accent);
  background:var(--bg-2);padding:0 5px;outline:none;font-size:13px}
.tacts{display:flex;gap:1px;opacity:0;transition:opacity .12s}
.trow:hover .tacts{opacity:1}
.tacts button{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;color:var(--text-3);transition:.1s}
.tacts button:hover{background:var(--border-2);color:var(--text)}
.tacts button[data-act="del"]:hover{background:rgba(255,69,58,.16);color:#ff453a}
.panel-foot{flex:0 0 auto;border-top:1px solid var(--border);padding:9px 12px;
  display:flex;align-items:center;gap:8px;background:var(--panel-2)}
.panel-foot label{font-size:11px;color:var(--text-3);font-weight:600;
  letter-spacing:.3px;text-transform:uppercase}
.panel-foot select{flex:1;height:30px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);padding:0 8px;outline:none;font-size:12.5px}
.panel-foot select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* RIGHT */
.view-head{height:50px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--border);flex:0 0 auto;background:var(--panel)}
.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:10px;border:1px solid var(--border)}
.tab{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:550;
  color:var(--text-2);transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow-s)}
[data-theme="dark"] .tab.active{background:#3a3a3c}
.view-extra{display:flex;align-items:center;gap:8px}
.view-body{flex:1;overflow:auto;position:relative}
.seg{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--border)}
.seg button{height:26px;padding:0 11px;border-radius:6px;font-size:12px;font-weight:540;
  color:var(--text-2);transition:.15s}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-s)}
[data-theme="dark"] .seg button.on{background:#3a3a3c}
.zoom{display:flex;align-items:center;gap:3px;background:var(--bg);padding:3px;
  border-radius:9px;border:1px solid var(--border)}
.zoom button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
  color:var(--text-2);font-size:14px;transition:.12s}
.zoom button:hover{background:var(--panel);color:var(--text)}
.zoom span{font-size:11.5px;color:var(--text-2);min-width:38px;text-align:center;
  font-variant-numeric:tabular-nums}
.zoom .mini{width:auto;padding:0 9px;font-size:11.5px;font-weight:550}

/* GRAPH */
.graph-scroll{position:absolute;inset:0;overflow:auto;padding:26px}
.graph-zoom{position:relative}
.graph-canvas{position:relative;transform-origin:0 0}
.graph-canvas svg{position:absolute;inset:0;overflow:visible;color:var(--text-3);pointer-events:none}
.gnode{position:absolute;display:flex;align-items:center;gap:9px;padding:0 12px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-s);cursor:pointer;transition:box-shadow .18s,transform .18s,border-color .18s;overflow:hidden}
.gnode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.gnode:hover{box-shadow:var(--shadow-m);transform:translateY(-1px);border-color:var(--border-2)}
.gnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-m)}
.gnode .g-ic{font-size:16px;flex:0 0 auto}
.gnode .g-tx{display:flex;flex-direction:column;min-width:0;flex:1}
.gnode .g-tx b{font-size:12.5px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnode .g-tx small{font-size:10px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnode .g-badge{font-size:10px;font-weight:700;background:var(--bg);border:1px solid var(--border);
  border-radius:20px;padding:1px 7px;color:var(--text-2);flex:0 0 auto}
.gnode .g-tog{position:absolute;right:-1px;top:50%;transform:translateY(-50%) translateX(50%);
  width:18px;height:18px;border-radius:50%;background:var(--panel);border:1px solid var(--border-2);
  display:grid;place-items:center;font-size:9px;color:var(--text-2);box-shadow:var(--shadow-s);z-index:2}
.gnode .g-tog:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* SCREENS */
.screens-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:auto}
.device{border-radius:38px;background:#1c1c1e;padding:12px;box-shadow:var(--shadow-l);
  transform-origin:top left;flex:0 0 auto;position:relative}
.device.phone{border-radius:44px;padding:11px}
.device.tablet{border-radius:26px;padding:14px}
.device.desktop{border-radius:14px;padding:10px;background:#2c2c2e}
.device-screen{width:100%;height:100%;border-radius:32px;overflow:hidden;background:var(--panel);
  display:flex;flex-direction:column;position:relative}
.device.tablet .device-screen{border-radius:14px}
.device.desktop .device-screen{border-radius:8px}
.device.phone .device-screen::before{content:"";position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:120px;height:26px;background:#1c1c1e;
  border-radius:0 0 16px 16px;z-index:5}
.scr-top{flex:0 0 auto;padding:14px 18px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);background:var(--panel)}
.device.phone .scr-top{padding-top:34px}
.scr-back{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:15px;color:var(--accent);transition:.12s}
.scr-back:hover{background:var(--accent-soft)}
.scr-title{font-weight:650;font-size:15px;letter-spacing:-.2px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr-body{flex:1;overflow:auto;padding:12px 14px 20px}
.scr-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
  cursor:pointer;transition:.14s;border:1px solid transparent}
.scr-row:hover{background:var(--hover);border-color:var(--border)}
.scr-row.sel{background:var(--sel);border-color:var(--accent)}
.scr-ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  font-size:17px;background:color-mix(in srgb,var(--c) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.scr-tx{flex:1;min-width:0}
.scr-tx b{display:block;font-size:13.5px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr-tx small{font-size:11px;color:var(--text-3)}
.scr-chev{color:var(--text-3);font-size:16px;opacity:.6}
.scr-empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:12.5px}
.scr-empty .big{font-size:36px;margin-bottom:10px;opacity:.5}

/* TABLE */
.tbl-wrap{padding:20px 22px 40px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--text-3);padding:11px 14px;background:var(--panel-2);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:.1s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr.sel{background:var(--sel)}
.tbl .nm{display:flex;align-items:center;gap:8px;font-weight:520}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  padding:2px 9px;border-radius:20px;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
.path{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* CODE */
.code-wrap{padding:20px 22px 40px;position:relative}
.code-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow-s)}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;
  border-bottom:1px solid var(--border);background:var(--panel-2)}
.code-head span{font-size:11px;font-weight:650;color:var(--text-2);letter-spacing:.3px}
.code-head .mini{font-size:11.5px;font-weight:550;color:var(--accent);padding:3px 9px;
  border-radius:7px;transition:.12s}
.code-head .mini:hover{background:var(--accent-soft)}
pre.code{margin:0;padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.65;
  overflow:auto;max-height:calc(100vh - 230px);color:var(--text);white-space:pre}
.outline-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:20px 22px;font-family:var(--mono);font-size:12.5px;line-height:1.85;
  white-space:pre;overflow:auto;box-shadow:var(--shadow-s);color:var(--text-2)}

/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,.94);color:#fff;padding:11px 20px;border-radius:14px;
  font-size:13px;font-weight:550;box-shadow:var(--shadow-l);opacity:0;pointer-events:none;
  transition:.28s cubic-bezier(.2,.9,.3,1.2);z-index:500;backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:9px}
[data-theme="dark"] .toast{background:rgba(240,240,245,.95);color:#000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:400;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.overlay.hidden{display:none}
.modal{width:min(560px,92vw);max-height:78vh;background:var(--panel);border-radius:20px;
  box-shadow:var(--shadow-l);border:1px solid var(--border);display:flex;flex-direction:column;
  overflow:hidden;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.modal-head{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.2px}
.modal-body{overflow:auto;padding:12px 14px 18px;flex:1}
.modal-close{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg);color:var(--text-2);transition:.12s}
.modal-close:hover{background:var(--border-2)}
.proj-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;transition:.12s}
.proj-item:hover{background:var(--hover)}
.proj-item .pi-ic{width:36px;height:36px;border-radius:10px;background:var(--bg);
  display:grid;place-items:center;font-size:17px;border:1px solid var(--border)}
.proj-item .pi-tx{flex:1;min-width:0}
.proj-item .pi-tx b{display:block;font-size:13.5px;font-weight:560;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-item .pi-tx small{font-size:11px;color:var(--text-3)}
.proj-item .pi-del{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-3);transition:.12s}
.proj-item .pi-del:hover{background:rgba(255,69,58,.14);color:#ff453a}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px}
.empty-state .big{font-size:40px;margin-bottom:12px;opacity:.4}

/* AI BADGE */
.ai-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  letter-spacing:.4px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  text-transform:uppercase}

/* FILE STATUS */
.file-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);
  padding:0 10px;max-width:220px;font-weight:500;transition:color .2s}
.file-status .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:0 0 7px;
  transition:background .2s,box-shadow .2s}
.file-status.dirty .dot{background:#ff9f0a;box-shadow:0 0 0 3px rgba(255,159,10,.18)}
.file-status.saved .dot{background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.18)}
.file-status .fname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ NODOS: PAN, PINES, CONEXIONES ============ */
.graph-scroll{cursor:grab;position:relative}
.graph-scroll.panning{cursor:grabbing}
.graph-scroll.panning *{user-select:none!important}

/* Node con pines */
.gnode{overflow:visible!important}
.gnode .g-pin{position:absolute;width:13px;height:13px;border-radius:50%;
  background:var(--panel);border:2px solid var(--border-2);cursor:crosshair;
  transition:transform .15s,background .15s,border-color .15s;z-index:4}
.gnode .g-pin:hover{background:var(--accent);border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft)}
.gnode .g-pin-in{left:-7px;top:50%;transform:translateY(-50%)}
.gnode .g-pin-out{right:-7px;top:50%;transform:translateY(-50%)}
.gnode .g-ic{cursor:pointer;border-radius:6px;padding:2px 4px;transition:background .12s}
.gnode .g-ic:hover{background:var(--hover);outline:1px solid var(--border-2)}
.gnode .g-name{cursor:text;padding:1px 3px;border-radius:4px;transition:background .12s}
.gnode .g-name:hover{background:var(--hover)}
.gnode .g-type{cursor:text;padding:1px 3px;border-radius:4px;transition:background .12s}
.gnode .g-type:hover{background:var(--hover)}
.gnode .g-desc{font-size:10px;color:var(--text-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;cursor:text;padding:1px 3px;border-radius:4px;
  transition:background .12s;max-width:180px;font-style:italic}
.gnode .g-desc:hover{background:var(--hover)}
.gnode.has-desc{height:auto!important;min-height:56px;padding:8px 14px;align-items:flex-start}
.gnode.has-desc .g-ic{margin-top:2px}
.gnode.dragging{opacity:.5;cursor:move}

/* Capa de conexiones */
.conn-layer{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:1}
.conn-path{fill:none;stroke:var(--accent);stroke-width:2;opacity:.65;
  transition:opacity .15s,stroke-width .15s}
.conn-path:hover{opacity:1;stroke-width:3;stroke:#ff453a}
.conn-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.conn-drag-line{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:visible}

/* Menú contextual */
.ctx-menu{position:fixed;min-width:230px;max-height:440px;padding:6px;
  background:color-mix(in srgb,var(--panel) 96%,transparent);
  backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-l);
  z-index:600;display:flex;flex-direction:column;overflow:hidden;
  animation:pop .14s cubic-bezier(.2,.9,.3,1.2)}
.ctx-menu.hidden{display:none}
.ctx-title{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--text-3);padding:8px 10px 4px}
.ctx-list{overflow-y:auto;padding:2px}
.ctx-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:9px;font-size:13px;text-align:left;transition:.1s}
.ctx-item:hover{background:var(--hover)}
.ctx-item.danger:hover{background:rgba(255,69,58,.15);color:#ff453a}
.ctx-item .ci-ic{width:22px;text-align:center;font-size:15px}
.ctx-sep{height:1px;background:var(--border);margin:5px 6px}

/* Popovers */
.popover{position:fixed;min-width:300px;max-width:360px;padding:14px;
  background:color-mix(in srgb,var(--panel) 96%,transparent);
  backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-l);
  z-index:610;animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
.popover.hidden{display:none}
.pop-title{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:10px}
.pop-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px;
  padding-bottom:12px;border-bottom:1px solid var(--border)}
.pop-emoji{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;
  font-size:18px;background:var(--bg);border:1px solid var(--border);transition:.12s}
.pop-emoji:hover{background:var(--hover);transform:scale(1.08);border-color:var(--accent)}
.pop-emoji.sel{background:var(--accent-soft);border-color:var(--accent)}
.pop-types{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.pop-type{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;
  border-radius:8px;font-size:12.5px;text-align:left;transition:.1s}
.pop-type:hover{background:var(--hover)}
.pop-type.sel{background:var(--sel)}
.pop-type .pt-ic{width:22px;text-align:center;font-size:15px}
.pop-field{margin-top:10px}
.pop-field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
.pop-field input,.pop-field textarea{width:100%;padding:8px 10px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg);outline:none;font-size:13px;
  font-family:inherit;resize:vertical;min-height:34px}
.pop-field textarea{min-height:80px;line-height:1.5}
.pop-field input:focus,.pop-field textarea:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.pop-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.pop-actions button{padding:7px 15px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.12s}
.pop-actions .btn-cancel{background:var(--bg);color:var(--text-2)}
.pop-actions .btn-cancel:hover{background:var(--border-2)}
.pop-actions .btn-ok{background:var(--accent);color:#fff}
.pop-actions .btn-ok:hover{background:var(--accent-2)}

/* Hint pan */
.pan-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);
  padding:6px 14px;border-radius:20px;font-size:11px;color:var(--text-3);
  border:1px solid var(--border);box-shadow:var(--shadow-m);pointer-events:none;
  display:flex;align-items:center;gap:8px;z-index:5;animation:fadeOut 5s forwards;white-space:nowrap}
@keyframes fadeOut{0%,72%{opacity:1}100%{opacity:0}}

/* Inspector */
.panel.inspector{width:340px;flex:0 0 auto;background:var(--panel);
  border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.panel.inspector.hidden{display:none}
.resizer.hidden{display:none}
.inspector-scroll{flex:1;overflow:auto;padding:18px 20px 80px}
.insp-cat{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;padding:3px 10px;border-radius:20px;background:var(--accent-soft);
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  margin-bottom:10px}
.insp-title{margin:6px 0 4px;font-size:20px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.insp-tpl{font-size:12.5px;color:var(--text-2);margin-bottom:10px;font-weight:550}
.insp-desc{font-size:13px;line-height:1.55;color:var(--text-2);margin:0}
.insp-sec{margin-top:22px}
.insp-h{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;

.insp-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.insp-stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;

.insp-stat span{display:block;font-size:9.5px;color:var(--text-3);font-weight:700;

.insp-ul{list-style:none;padding:0;margin:0;font-size:12.5px;line-height:1.7}

.insp-ul li{color:var(--text-2)}
.insp-ul b{color:var(--text);font-weight:600}
.insp-desc-txt{color:var(--text-3);font-style:italic;font-size:11px}
</style>

/* =====================================================================
   HELPERS ÁRBOL
   ===================================================================== */
function hydrate(node){
  node.id=node.id||uid();
  node.children=Array.isArray(node.children)?node.children:[];
  node.links=Array.isArray(node.links)?node.links:[];
  if(node.description===undefined)node.description='';
  node.children.forEach(hydrate);
  return node;
}
function findNode(id,node=state.root){
  if(!node)return null;
  if(node.id===id)return node;
  for(const c of node.children){const r=findNode(id,c);if(r)return r;}
  return null;
}
function findParent(id,node=state.root,parent=null){
  if(!node)return null;
  if(node.id===id)return parent;
  for(const c of node.children){const r=findParent(id,c,node);if(r)return r;}
  return null;
}
function getTemplate(){return TEMPLATES.find(t=>t.id===state.templateId)||TEMPLATES[0];}
function typeOf(key){const t=getTemplate();return t.types[key]||{label:key||'Nodo',icon:'•',color:C.gray};}
function countAll(node){return 1+node.children.reduce((a,c)=>a+countAll(c),0);}
function walk(node,fn,depth=0,parent=null){fn(node,depth,parent);node.children.forEach(c=>walk(c,fn,depth+1,node));}

function renderTplList(filter=''){
  const list=$('#tplList');

    t.desc.toLowerCase().includes(f)||(t.group||'').toLowerCase().includes(f));
  if(!items.length){
    list.innerHTML=`<div class="empty-state" style="padding:28px 10px"><div class="big">🔍</div>Sin resultados</div>`;
    return;
  }
  const groups={};
  items.forEach(t=>{(groups[t.group]=groups[t.group]||[]).push(t);});
  list.innerHTML=Object.entries(groups).map(([g,arr])=>`

}

function loadTemplate(id,silent=false){
  const tpl=TEMPLATES.find(t=>t.id===id);
  if(!tpl)return;
  if(!silent&&state.root&&!confirm('¿Cargar esta plantilla? Se reemplazará el contenido actual.'))return;
  state.templateId=id;
  state.root=hydrate(JSON.parse(JSON.stringify(tpl.tree)));
  state.projectName=state.root.name;
  state.selectedId=state.root.id;
  state.collapsed=new Set();
  state.zoom=1;state.zoomX=30;state.zoomY=30;state._centered=false;
  $('#projName').value=state.projectName;
  $('#tplIcon').textContent=tpl.icon;
  $('#tplName').textContent=tpl.name;
  buildTypeSelect();
  renderTree();
  renderView();
  if(!silent){ state.fileHandle=null; markDirty(); }
  if(!silent)toast('Plantilla cargada: '+tpl.name,tpl.icon);
}

   ÁRBOL IZQUIERDO
   ===================================================================== */
function renderTree(){
  const host=$('#tree');
  host.innerHTML='';
  host.appendChild(buildTreeNodes(state.root,0));
}

function buildTreeNodes(node,depth){
  const frag=document.createDocumentFragment();
  const tp=typeOf(node.type);
  const hasKids=node.children.length>0;
  const collapsed=state.collapsed.has(node.id);

  const row=document.createElement('div');
  row.className='trow'+(node.id===state.selectedId?' sel':'');
  row.dataset.id=node.id;
  row.style.paddingLeft=(6+depth*15)+'px';
  row.innerHTML=`
    <button class="caret ${hasKids?'':'empty'}">${hasKids?(collapsed?'▶':'▼'):'•'}</button>
    <span class="ticon">${tp.icon}</span>
    <span class="tname">${esc(node.name)}</span>
    <span class="tacts">
      <button data-act="add" title="Añadir hijo">＋</button>
      <button data-act="ren" title="Renombrar">✎</button>
      <button data-act="dup" title="Duplicar">⧉</button>
      <button data-act="del" title="Eliminar">✕</button>
    </span>`;
  row.addEventListener('click',e=>{
    if(e.target.closest('.caret')){
      if(!hasKids)return;
      if(collapsed)state.collapsed.delete(node.id);else state.collapsed.add(node.id);
      renderTree();return;
    }
    const act=e.target.closest('[data-act]');
    if(act){
      e.stopPropagation();
      const a=act.dataset.act;
      if(a==='add')addChild(node);
      else if(a==='ren')renameNode(node,row);
      else if(a==='dup')dupNode(node);
      else if(a==='del')delNode(node);
      return;
    }
    state.selectedId=node.id;
    renderTree();renderView();
  });
  row.addEventListener('dblclick',e=>{
    if(e.target.closest('button'))return;
    renameNode(node,row);
  });
  frag.appendChild(row);

  if(!collapsed){
    node.children.forEach(c=>frag.appendChild(buildTreeNodes(c,depth+1)));
  }
  return frag;
}

function addChild(node){
  const typeKey=$('#newTypeSelect').value||Object.keys(getTemplate().types)[1];
  const child={name:'Nuevo elemento',type:typeKey,children:[],id:uid()};
  node.children.push(child);
  state.collapsed.delete(node.id);
  state.selectedId=child.id;
  markDirty();
  renderTree();renderView();
  toast('Elemento añadido','＋');
}
function renameNode(node,row){
  const span=row.querySelector('.tname');
  const old=node.name;
  span.innerHTML=`<input value="${esc(old)}">`;
  const inp=span.querySelector('input');
  inp.focus();inp.select();
  const finish=()=>{
    const v=inp.value.trim()||old;
    node.name=v;
    if(node===state.root){state.projectName=v;$('#projName').value=v;}
    markDirty();
    renderTree();renderView();
  };
  inp.addEventListener('blur',finish);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    if(e.key==='Escape'){inp.value=old;inp.blur();}
  });
}
function dupNode(node){
  const parent=findParent(node.id);
  if(!parent)return;
  const copy=JSON.parse(JSON.stringify(node));
  reId(copy);
  copy.name=node.name+' (copia)';
  const idx=parent.children.indexOf(node);
  parent.children.splice(idx+1,0,copy);
  state.selectedId=copy.id;
  markDirty();
  renderTree();renderView();
  toast('Duplicado','⧉');
}
function reId(n){n.id=uid();n.children.forEach(reId);}
function delNode(node){
  if(node===state.root){toast('No puedes eliminar la raíz','⚠️');return;}
  const parent=findParent(node.id);
  if(!parent)return;
  if(!confirm(`¿Eliminar "${node.name}" y sus hijos?`))return;
  // Limpia links hacia el nodo eliminado
  const toRemove=new Set();
  walk(node,n=>toRemove.add(n.id));
  walk(state.root,n=>{
    if(n.links)n.links=n.links.filter(id=>!toRemove.has(id));
  });
  parent.children=parent.children.filter(c=>c.id!==node.id);
  state.selectedId=parent.id;
  markDirty();renderTree();renderView();
  toast('Eliminado','✕');
}

/* ---------- NODOS ---------- */
const NODE_W=220,NODE_H=52,GX=60,GY=22;
function computeLayout(){
  const positions=new Map();
  let cursorY=0;
  function place(node,depth){
    const kids=node.children.filter(c=>!state.collapsed.has(node.id));
    if(!kids.length){
      const y=cursorY;
      cursorY+=NODE_H+GY;
      positions.set(node.id,{x:depth*(NODE_W+GX),y});
      return y;
    }
    const ys=kids.map(k=>place(k,depth+1));
    const y=(ys[0]+ys[ys.length-1])/2;
    positions.set(node.id,{x:depth*(NODE_W+GX),y});
    return y;
  }
  place(state.root,0);
  let maxX=0,maxY=0;
  positions.forEach(p=>{maxX=Math.max(maxX,p.x+NODE_W);maxY=Math.max(maxY,p.y+NODE_H);});
  return {positions,width:maxX,height:maxY};
}

let lastLayout=null;

function renderNodes(host){
  const layout=computeLayout();
  lastLayout=layout;

  // Auto-centrar la primera vez
  if(!state._centered){
    const b=$('#viewBody');
    const w=b.clientWidth||800, h=b.clientHeight||600;
    state.zoom=1;
    state.zoomX=Math.max(40,(w-layout.width)/2);
    state.zoomY=Math.max(40,(h-layout.height)/2);
    state._centered=true;
  }

  const scroll=document.createElement('div');
  scroll.className='graph-scroll';
  scroll.innerHTML=`
    <div class="graph-zoom">
      <div class="graph-canvas" style="width:${layout.width+40}px;height:${layout.height+40}px;transform:translate(${state.zoomX}px, ${state.zoomY}px) scale(${state.zoom})">
        <svg class="conn-layer" width="${layout.width+40}" height="${layout.height+40}"></svg>
        ${renderNodeHTML(state.root,layout)}
      </div>
    </div>
    <div class="pan-hint">🖱️ Arrastra para mover · Rueda para desplazar · Ctrl+Rueda zoom · Clic derecho para crear nodo</div>`;
  host.appendChild(scroll);

  // Conexiones jerárquicas (padre→hijo)
  const connLayer=scroll.querySelector('.conn-layer');
  walk(state.root,(node)=>{
    if(state.collapsed.has(node.id))return;
    const p=layout.positions.get(node.id);if(!p)return;
    node.children.forEach(c=>{
      const cp=layout.positions.get(c.id);if(!cp)return;
      const elP=document.querySelector(`.gnode[data-id="${node.id}"]`);
      const elC=document.querySelector(`.gnode[data-id="${c.id}"]`);
      const hp=elP?elP.offsetHeight:NODE_H, hc=elC?elC.offsetHeight:NODE_H;
      const x1=p.x+NODE_W, y1=p.y+hp/2;
      const x2=cp.x,        y2=cp.y+hc/2;
      const mid=(x1+x2)/2;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
      path.setAttribute('fill','none');
      path.setAttribute('stroke','currentColor');
      path.setAttribute('stroke-width','1.5');
      path.setAttribute('opacity',c.id===state.selectedId||node.id===state.selectedId?'1':'0.4');
      connLayer.appendChild(path);
    });
  });

  // Conexiones libres (links) — se dibujan tras un frame para medir alturas reales
  requestAnimationFrame(()=>{drawConnections(connLayer);});

  // ====== Eventos sobre nodos ======
  scroll.querySelectorAll('.gnode').forEach(el=>{
    const id=el.dataset.id;

    // Clic en toggle
    el.querySelector('.g-tog')?.addEventListener('click',e=>{
      e.stopPropagation();
      if(state.collapsed.has(id))state.collapsed.delete(id);else state.collapsed.add(id);
      renderView();
    });

    // Clic en icono → popover
    el.querySelector('.g-ic')?.addEventListener('click',e=>{
      e.stopPropagation();
      showIconPopover(id,e.clientX+10,e.clientY+10);
    });

    // Clic en pin-out → iniciar drag
    el.querySelector('.g-pin-out')?.addEventListener('mousedown',e=>{
      startPinDrag(e,id);
    });

    // Doble clic en nombre → renombrar
    el.querySelector('.g-name')?.addEventListener('dblclick',e=>{
      e.stopPropagation();
      const n=findNode(id);if(!n)return;
      // Reutiliza el sistema de rename del árbol, pero inline en el grafo
      const b=e.target;
      const old=n.name;
      b.contentEditable=true;b.textContent=old;
      b.focus();
      const range=document.createRange();range.selectNodeContents(b);
      const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
      const finish=()=>{
        b.contentEditable=false;
        const v=(b.textContent||'').trim()||old;
        n.name=v;
        if(n===state.root){state.projectName=v;$('#projName').value=v;}
        markDirty();renderTree();renderView();
      };
      b.addEventListener('blur',finish,{once:true});
      b.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'){ev.preventDefault();b.blur();}
        if(ev.key==='Escape'){b.textContent=old;b.blur();}
      });
    });

    // Doble clic en tipo/desc → editar descripción
    el.querySelector('.g-type')?.addEventListener('dblclick',e=>{
      e.stopPropagation();
      showDescPopover(id,e.clientX+10,e.clientY+10);
    });
    el.querySelector('.g-desc')?.addEventListener('dblclick',e=>{
      e.stopPropagation();
      showDescPopover(id,e.clientX+10,e.clientY+10);
    });

    // Clic contextual en nodo
    el.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      state.selectedId=id;renderTree();
      showNodeMenu(e.clientX,e.clientY,id);
    });

    // Clic simple → seleccionar (a menos que sea en un control)
    el.addEventListener('click',e=>{
      if(e.target.closest('.g-tog,.g-pin,.g-ic,.g-name[contenteditable],.g-desc,.g-type'))return;
      state.selectedId=id;renderTree();renderView();
    });
  });

  // ====== PAN (arrastrar fondo) ======
  scroll.addEventListener('mousedown',e=>{
    if(e.target.closest('.gnode'))return;
    if(e.button!==0)return;
    e.preventDefault();
    scroll.classList.add('panning');
    const sx=e.clientX,sy=e.clientY;
    const ox=state.zoomX,oy=state.zoomY;
    const canvas=scroll.querySelector('.graph-canvas');
    const move=ev=>{
      state.zoomX=ox+(ev.clientX-sx);
      state.zoomY=oy+(ev.clientY-sy);
      if(canvas)canvas.style.transform=`translate(${state.zoomX}px, ${state.zoomY}px) scale(${state.zoom})`;
    };
    const up=()=>{
      scroll.classList.remove('panning');
      window.removeEventListener('mousemove',move);
      window.removeEventListener('mouseup',up);
    };
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);
  });

  // ====== Rueda: scroll = pan · Ctrl+Rueda = zoom ======
  scroll.addEventListener('wheel',e=>{
    if(!e.ctrlKey && !e.metaKey){
      e.preventDefault();
      state.zoomX-=e.deltaX;
      state.zoomY-=e.deltaY;
      applyGraphTransform();
    }else{
      e.preventDefault();
      zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12);
    }
  },{passive:false});

  // ====== Clic derecho en fondo ======
  scroll.addEventListener('contextmenu',e=>{
    if(e.target.closest('.gnode'))return;
    e.preventDefault();
    showCanvasMenu(e.clientX,e.clientY);
  });

  // ====== Doble clic en fondo = recentrar ======
  scroll.addEventListener('dblclick',e=>{
    if(e.target.closest('.gnode'))return;
    state._centered=false;renderView();
  });
}

function renderNodeHTML(node,layout){
  const p=layout.positions.get(node.id);
  if(!p)return '';
  const tp=typeOf(node.type);
  const icon=node.icon||tp.icon;
  const collapsed=state.collapsed.has(node.id);
  const hasKids=node.children.length>0;
  const sel=node.id===state.selectedId?'sel':'';
  const hasDesc=!!node.description;
  const nLinks=(node.links||[]).length;
  let html=`
    <div class="gnode ${sel} ${hasDesc?'has-desc':''}" data-id="${node.id}" style="left:${p.x}px;top:${p.y}px;width:${NODE_W}px;--c:${tp.color}">
      <span class="g-pin g-pin-in" data-pin="in" data-id="${node.id}" title="Pin de entrada"></span>
      <span class="g-ic" title="Clic para cambiar icono / tipo">${icon}</span>
      <span class="g-tx">
        <b class="g-name" title="Doble clic para renombrar">${esc(node.name)}</b>
        <small class="g-type" title="Doble clic para editar descripción">${esc(tp.label)}${hasKids?' · '+node.children.length:''}${nLinks?' · 🔗'+nLinks:''}</small>
        ${hasDesc?`<span class="g-desc" title="Doble clic para editar">${esc(node.description)}</span>`:''}
      </span>
      ${hasKids?`<button class="g-tog" title="${collapsed?'Expandir':'Contraer'}">${collapsed?'+':'−'}</button>`:''}
      <span class="g-pin g-pin-out" data-pin="out" data-id="${node.id}" title="Arrastra para conectar"></span>
    </div>`;
  if(!collapsed){
    node.children.forEach(c=>{html+=renderNodeHTML(c,layout);});
  }
  return html;
}

function fitZoom(){
  if(!lastLayout)return;
  const b=$('#viewBody');
  const w=b.clientWidth-60,h=b.clientHeight-60;
  const z=Math.min(w/lastLayout.width,h/lastLayout.height,1.5);
  state.zoom=Math.max(.3,Math.round(z*100)/100);
  state.zoomX=(b.clientWidth-lastLayout.width*state.zoom)/2;
  state.zoomY=(b.clientHeight-lastLayout.height*state.zoom)/2;
  renderView();
}

function buildOutline(node,depth){
  const tp=typeOf(node.type);
  const ind='  '.repeat(depth);
  let s=`${ind}${depth?'└─ ':''}${tp.icon} ${node.name}  [${tp.label}]\n`;
  node.children.forEach(c=>{s+=buildOutline(c,depth+1);});
  return s;
}

/* =====================================================================
   SERIALIZACIÓN
   ===================================================================== */
function serialize(node){
  const o={name:node.name,type:node.type};
  if(node.icon)o.icon=node.icon;
  if(node.description)o.description=node.description;
  if(node.links&&node.links.length)o.links=[...node.links];
  o.children=node.children.map(serialize);
  return o;
}

function doExport(fmt){
  const name=state.projectName||'proyecto';
  let content='',file='',mime='text/plain';
  switch(fmt){
    case 'ai-json':
      content=toAIJSON();file=`${name}-IA.json`;mime='application/json';break;
    case 'ai-md':
      content=toAIMarkdown();file=`${name}-IA.md`;mime='text/markdown';break;
    case 'json':
      content=JSON.stringify({
        version:1,exported:new Date().toISOString(),
        templateId:state.templateId,projectName:state.projectName,
        template:getTemplate().name,tree:serialize(state.root)
      },null,2);
      file=`${name}.json`;mime='application/json';break;
    case 'md':content=toMarkdown(false);file=`${name}.md`;mime='text/markdown';break;
    case 'txt':content=toASCII();file=`${name}.txt`;break;
    case 'csv':content=toCSV();file=`${name}.csv`;mime='text/csv';break;
    case 'mmd':content=toMermaid();file=`${name}.mmd`;break;
    case 'svg':content=toSVG();file=`${name}.svg`;mime='image/svg+xml';break;
    case 'html':content=toHTML();file=`${name}.html`;mime='text/html';break;
  }
  download(file,content,mime);
  toast('Exportado: '+fmt.toUpperCase(),'📤');
}

function download(filename,text,mime){
  const blob=new Blob([text],{type:mime+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- EXPORT IA: JSON ---------- */
function toAIJSON(){
  const tpl=getTemplate();
  const typeDict={};
  Object.entries(tpl.types).forEach(([k,v])=>{
    typeDict[k]={label:v.label,icon:v.icon,color:v.color};
  });
  function ser(node,parentPath=''){
    const tp=typeOf(node.type);
    const path=parentPath?parentPath+' / '+node.name:node.name;
    return {
      id:node.id,
      name:node.name,
      type:node.type,
      type_label:tp.label,
      path,
      depth:path.split(' / ').length-1,
      children_count:node.children.length,
      children:node.children.map(c=>ser(c,path))
    };
  }
  const payload={
    _schema:'flowstudio/v1',
    _purpose:'Semantic tree structure exported for LLM/AI consumption. The "tree" field is a hierarchical JSON. Each node has name, type (enum), type_label (human readable), path (full), depth and children.',
    _ai_instructions:{
      es:'Esta es una estructura jerárquica de tipo "'+tpl.name+'". Puedes usarla para: generar código, redactar documentación, planificar tareas, revisar consistencia, o proponer mejoras. Respeta la jerarquía padre-hijo. El campo "type" indica la naturaleza de cada nodo.',
      en:'This is a hierarchical structure of type "'+tpl.name+'". Use it to: generate code, write documentation, plan tasks, review consistency or propose improvements. Respect parent-child hierarchy. The "type" field indicates the nature of each node.'
    },
    project:{
      name:state.projectName,
      template_id:state.templateId,
      template_name:tpl.name,
      template_description:tpl.desc,
      group:tpl.group,
      exported_at:new Date().toISOString(),
      total_nodes:countAll(state.root),
      max_depth:getMaxDepth(state.root)
    },
    type_dictionary:typeDict,
    tree:ser(state.root)
  };
  return JSON.stringify(payload,null,2);
}

function getMaxDepth(node,d=0){
  if(!node.children.length)return d;
  return Math.max(...node.children.map(c=>getMaxDepth(c,d+1)));
}

/* ---------- EXPORT IA: MARKDOWN ---------- */
function toAIMarkdown(){
  const tpl=getTemplate();
  const lines=[];
  lines.push(`# ${state.projectName}`);

  lines.push(`> **Plantilla:** ${tpl.name} · **Rubro:** ${tpl.group}`);
  lines.push(`> **Descripción:** ${tpl.desc}`);

  lines.push('');
  lines.push('Este documento describe una **estructura jerárquica** exportada desde FlowStudio. Cada nivel de sangría representa una relación padre → hijo. Los iconos y etiquetas entre corchetes indican el tipo de cada elemento.');
  lines.push('');
  lines.push('**Usos recomendados:**');
  lines.push('- Generar código, contenido o documentación basada en la estructura');
  lines.push('- Planificar tareas, estimaciones y dependencias');
  lines.push('- Detectar huecos, redundancias o inconsistencias');
  lines.push('- Proponer mejoras o reorganizaciones');
  lines.push('');
  lines.push(`**Metadatos:** ${countAll(state.root)} nodos totales · profundidad máxima ${getMaxDepth(state.root)} · rubro *${tpl.group}*`);
  lines.push('');
  lines.push('---');
  lines.push('');
  lines.push('## 🌳 Estructura');
  lines.push('');
  lines.push(mdTree(state.root,0,tpl));
  lines.push('');
  lines.push('---');
  lines.push('');
  lines.push('## 📋 Listado tabular (para procesamiento)');
  lines.push('');
  lines.push('| # | Profundidad | Tipo | Nombre | Ruta |');
  lines.push('|---|-------------|------|--------|------|');
  let i=0;
  walk(state.root,(node,depth)=>{
    const tp=typeOf(node.type);
    const pathNodes=[];
    let cur=node;
    while(cur!==state.root){const p=findParent(cur.id);if(!p)break;pathNodes.unshift(p.name);cur=p;}
    const path=pathNodes.join(' / ')||'—';
    i++;
    lines.push(`| ${i} | ${depth} | ${tp.label} | ${node.name} | ${path} |`);
  });

function mdTree(node,depth,tpl){
  const tp=typeOf(node.type);
  const indent='  '.repeat(depth);
  const bullet=depth===0?'':'- ';
  const bold=depth<2?'**':'';
  return `${indent}${bullet}${tp.icon} ${bold}${node.name}${bold} *(${tp.label})*\n` +
    node.children.map(c=>mdTree(c,depth+1,tpl)).join('');
}

/* ---------- MARKDOWN NORMAL ---------- */
function toMarkdown(withAI){
  const tpl=getTemplate();
  const lines=[];
  lines.push(`# ${state.projectName}`);
  lines.push('');
  lines.push(`**Plantilla:** ${tpl.name}`);
  lines.push(`**Rubro:** ${tpl.group}`);
  lines.push(`**Nodos:** ${countAll(state.root)}`);
  lines.push('');
  lines.push('## Estructura');
  lines.push('');
  function rec(node,depth){
    const tp=typeOf(node.type);
    lines.push(`${'  '.repeat(depth)}- ${tp.icon} **${node.name}** _(${tp.label})_`);
    node.children.forEach(c=>rec(c,depth+1));
  }
  rec(state.root,0);
  return lines.join('\n');
}

/* ---------- ASCII TREE ---------- */
function toASCII(){
  const lines=[];
  function rec(node,prefix='',isLast=true){
    const tp=typeOf(node.type);
    lines.push(prefix+(prefix?'└─ ':'')+tp.icon+' '+node.name);
    const kids=node.children;
    const newPrefix=prefix+(isLast?'   ':'│  ');
    kids.forEach((c,i)=>rec(c,prefix?newPrefix:(prefix+''),i===kids.length-1));
  }
  rec(state.root);
  return lines.join('\n');
}

/* ---------- CSV ---------- */
function toCSV(){
  const rows=[['Profundidad','Tipo','Nombre','Ruta','Nº hijos']];
  walk(state.root,(node,depth)=>{
    const tp=typeOf(node.type);
    const pathNodes=[];
    let cur=node;
    while(cur!==state.root){const p=findParent(cur.id);if(!p)break;pathNodes.unshift(p.name);cur=p;}
    rows.push([depth,tp.label,node.name,pathNodes.join(' / ')||'—',node.children.length]);
  });
  return rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
}

/* ---------- MERMAID ---------- */
function toMermaid(){
  const lines=['flowchart TD'];
  const ids=new Map();
  let counter=0;
  function getId(n){if(!ids.has(n.id)){ids.set(n.id,'N'+(counter++));}return ids.get(n.id);}
  function label(n){
    const tp=typeOf(n.type);
    return `${tp.icon} ${n.name}`.replace(/["'`]/g,'');
  }
  walk(state.root,(node)=>{
    const id=getId(node);
    lines.push(`  ${id}["${label(node)}"]`);
    node.children.forEach(c=>{
      lines.push(`  ${id} --> ${getId(c)}`);
    });
  });
  return lines.join('\n');
}

/* ---------- SVG ---------- */
function toSVG(){
  const layout=computeLayout();
  const pad=30;
  const W=layout.width+pad*2,H=layout.height+pad*2;
  const parts=[];
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">`);
  parts.push(`<rect width="${W}" height="${H}" fill="#ffffff"/>`);
  walk(state.root,node=>{
    if(state.collapsed.has(node.id))return;
    const p=layout.positions.get(node.id);
    node.children.forEach(c=>{
      const cp=layout.positions.get(c.id);
      if(!cp)return;
      const x1=p.x+NODE_W+pad,y1=p.y+NODE_H/2+pad;
      const x2=cp.x+pad,y2=cp.y+NODE_H/2+pad;
      const mid=(x1+x2)/2;
      parts.push(`<path d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>`);
    });
  });
  walk(state.root,node=>{
    const p=layout.positions.get(node.id);
    if(!p)return;
    const tp=typeOf(node.type);
    const x=p.x+pad,y=p.y+pad;
    parts.push(`<g transform="translate(${x},${y})">`);
    parts.push(`<rect width="${NODE_W}" height="${NODE_H}" rx="12" fill="#ffffff" stroke="#e5e5ea"/>`);
    parts.push(`<rect width="3" height="${NODE_H}" fill="${tp.color}"/>`);
    parts.push(`<text x="14" y="21" font-size="16">${esc(tp.icon)}</text>`);

/* ---------- PAN/ZOOM ---------- */
function applyGraphTransform(){
  const canvas=document.querySelector('.graph-canvas');
  if(canvas)canvas.style.transform=`translate(${state.zoomX}px, ${state.zoomY}px) scale(${state.zoom})`;
  const zv=document.querySelector('#zVal');
  if(zv)zv.textContent=Math.round(state.zoom*100)+'%';
}
function zoomAt(clientX,clientY,factor){
  const sc=document.querySelector('.graph-scroll'); if(!sc)return;
  const r=sc.getBoundingClientRect();
  const px=clientX-r.left, py=clientY-r.top;
  const oldZ=state.zoom, newZ=Math.max(0.2,Math.min(3,oldZ*factor));
  state.zoomX=px-(px-state.zoomX)*(newZ/oldZ);
  state.zoomY=py-(py-state.zoomY)*(newZ/oldZ);
  state.zoom=newZ;
  applyGraphTransform();
}

/* ---------- Posición de pines ---------- */
function getNodeBox(nodeId){
  const el=document.querySelector(`.gnode[data-id="${nodeId}"]`);
  if(!el)return null;
  const nw=parseFloat(el.style.width)||NODE_W;
  const nh=el.offsetHeight||NODE_H;
  const nx=parseFloat(el.style.left)||0;
  const ny=parseFloat(el.style.top)||0;
  return {
    x:nx, y:ny, w:nw, h:nh,
    inX:nx, inY:ny+nh/2,
    outX:nx+nw, outY:ny+nh/2
  };
}

/* ---------- Dibujar conexiones ---------- */
function drawConnections(svg){
  // Elimina capas previas
  svg.querySelectorAll('.conn-path,.conn-hit').forEach(e=>e.remove());
  // Recorre nodos y dibuja links
  walk(state.root,(node)=>{
    if(state.collapsed.has(node.id))return;
    const from=getNodeBox(node.id);
    if(!from)return;
    (node.links||[]).forEach(targetId=>{
      const target=findNode(targetId);
      if(!target)return;
      if(state.collapsed.has(target.id))return;
      const to=getNodeBox(targetId);
      if(!to)return;
      const mid=(from.outX+to.inX)/2;
      const d=`M ${from.outX} ${from.outY} C ${mid} ${from.outY}, ${mid} ${to.inY}, ${to.inX} ${to.inY}`;
      // Path visible
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',d);p.setAttribute('class','conn-path');
      p.dataset.from=node.id;p.dataset.to=targetId;
      svg.appendChild(p);
      // Hit area (más gruesa, invisible)
      const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
      hit.setAttribute('d',d);hit.setAttribute('class','conn-hit');
      hit.dataset.from=node.id;hit.dataset.to=targetId;
      hit.addEventListener('click',e=>{
        e.stopPropagation();
        if(!confirm('¿Eliminar esta conexión?'))return;
        const n=findNode(hit.dataset.from);
        if(n)n.links=n.links.filter(x=>x!==hit.dataset.to);
        markDirty();renderView();
        toast('Conexión eliminada','✂️');
      });
      svg.appendChild(hit);
    });
  });
}

/* ---------- Drag de pines ---------- */
function startPinDrag(e,fromId){
  e.preventDefault();e.stopPropagation();
  const scroll=document.querySelector('.graph-scroll');
  if(!scroll)return;
  const rect=scroll.getBoundingClientRect();
  // Crea línea temporal
  const dragSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  dragSvg.setAttribute('class','conn-drag-line');
  dragSvg.style.width='100%';dragSvg.style.height='100%';
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('fill','none');
  path.setAttribute('stroke','#0a84ff');
  path.setAttribute('stroke-width','2.5');
  path.setAttribute('stroke-dasharray','6 4');
  dragSvg.appendChild(path);
  scroll.appendChild(dragSvg);

  const from=getNodeBox(fromId);
  const startX=from.outX, startY=from.outY;

  function move(ev){
    const cx=ev.clientX-rect.left;
    const cy=ev.clientY-rect.top;
    const mid=(startX+cx)/2;
    path.setAttribute('d',`M ${startX} ${startY} C ${mid} ${startY}, ${mid} ${cy}, ${cx} ${cy}`);
    // Resalta nodo bajo el cursor
    document.querySelectorAll('.gnode').forEach(n=>n.classList.remove('pin-target'));
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    const target=el?.closest?.('.gnode');
    if(target&&target.dataset.id!==fromId)target.style.boxShadow='0 0 0 3px #0a84ff';
  }
  function up(ev){
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    dragSvg.remove();
    document.querySelectorAll('.gnode').forEach(n=>{n.style.boxShadow='';});
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    const target=el?.closest?.('.gnode');
    if(target&&target.dataset.id!==fromId){
      const tId=target.dataset.id;
      const fromNode=findNode(fromId);
      if(fromNode){
        if(!fromNode.links)fromNode.links=[];
        if(!fromNode.links.includes(tId)){
          fromNode.links.push(tId);
          markDirty();renderView();
          toast('Conexión creada','🔗');
        }
      }
    }
  }
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

/* ---------- Inspector ---------- */
function toggleInspector(force){
  state.inspectorOpen = force===undefined ? !state.inspectorOpen : !!force;
  $('#inspectorPanel').classList.toggle('hidden',!state.inspectorOpen);
  $('#resizerInspector').classList.toggle('hidden',!state.inspectorOpen);
  localStorage.setItem('fs-inspector',state.inspectorOpen?'1':'0');
  if(state.inspectorOpen)renderInspector();
}
function renderInspector(){
  if(!state.inspectorOpen)return;
  const body=$('#inspectorBody');if(!body)return;
  body.innerHTML=buildNarrativeHTML();
}
function buildNarrativeHTML(){
  const tpl=getTemplate();
  if(!state.root)return '<div class="insp-desc">Sin contenido</div>';
  const parts=[];
  parts.push(`<div class="insp-cat">${esc(tpl.group)}</div>
    <h2 class="insp-title">${esc(state.projectName)}</h2>
    <div class="insp-tpl">${tpl.icon} ${esc(tpl.name)}</div>
    <p class="insp-desc">${esc(tpl.desc)}</p>`);
  const total=countAll(state.root), depth=getMaxDepth(state.root);
  const typeCount={};walk(state.root,n=>{typeCount[n.type]=(typeCount[n.type]||0)+1;});
  parts.push(`<div class="insp-sec"><div class="insp-h">📊 Resumen</div>
    <div class="insp-stats">
      <div class="insp-stat"><span>Elementos</span><b>${total}</b></div>
      <div class="insp-stat"><span>Niveles</span><b>${depth+1}</b></div>
      <div class="insp-stat"><span>Tipos</span><b>${Object.keys(typeCount).length}</b></div>
    </div></div>`);
  parts.push(`<div class="insp-sec"><div class="insp-h">📖 Descripción</div>
    <ul class="insp-ul">${narrProse(state.root,true)}</ul></div>`);
  return parts.join('');
}
function narrProse(node,isRoot){
  const tp=typeOf(node.type);
  const icon=node.icon||tp.icon;
  const desc=node.description?` <span class="insp-desc-txt">— ${esc(node.description)}</span>`:'';
  const kids=node.children;
  if(isRoot){
    let s=`<li><b>${esc(node.name)}</b> <span style="color:var(--text-3)">(${esc(tp.label)})</span>${desc}`;
    if(kids.length){
      s+=`<ul>${kids.map(k=>narrProse(k,false)).join('')}</ul>`;
    }
    return s+`</li>`;
  }
  let s=`<li>${icon} <b>${esc(node.name)}</b> <span style="color:var(--text-3)">(${esc(tp.label)})</span>${desc}`;
  if(kids.length){
    s+=`<ul>${kids.map(k=>narrProse(k,false)).join('')}</ul>`;
  }
  return s+`</li>`;
}

    version:1,
    savedAt:new Date().toISOString(),
    projectName:state.projectName,
    templateId:state.templateId,
    tree:serialize(state.root)
  };
}

function markDirty(){
  if(state.dirty){updateFileStatus();return;}
  state.dirty=true;
  updateFileStatus();
}

function markClean(){
  state.dirty=false;
  updateFileStatus();
}

function updateFileStatus(){
  const fs=$('#fileStatus');
  if(!fs)return;
  fs.classList.toggle('dirty', state.dirty);
  fs.classList.toggle('saved', !state.dirty && !!state.fileHandle);
  const name = state.fileHandle ? state.fileHandle.name : 'Sin guardar';
  fs.querySelector('.fname').textContent = name;
  fs.title = state.fileHandle
    ? `Archivo: ${state.fileHandle.name}${state.dirty?' · cambios sin guardar':''}`
    : 'Proyecto no guardado en disco';
  document.title = (state.dirty?'● ':'') + (state.projectName||'FlowStudio') + ' — FlowStudio';
}

async function openProjectFile(){
  if(!HAS_FS_API){ $('#fileInput').click(); return; }
  try{
    const [handle] = await window.showOpenFilePicker({
      types:[{description:'Proyecto FlowStudio',
              accept:{'application/json':['.flowstudio','.json']}}],
      multiple:false
    });
    const file = await handle.getFile();
    const text = await file.text();
    if(applyLoadedProject(text, handle)) toast('Abierto: '+handle.name,'📂');
  }catch(e){
    if(e.name!=='AbortError') toast('Error: '+e.message,'⚠️');
  }
}

async function saveProjectAs(){
  if(!HAS_FS_API){
    const base=(state.projectName||'proyecto').replace(/[^a-z0-9\-_]/gi,'-');
    download(base+'.flowstudio',JSON.stringify(buildProjectData(),null,2),'application/json');
    markClean();
    toast('Descargado: '+base+'.flowstudio','💾');
    return;
  }
  try{
    const base=(state.projectName||'proyecto').replace(/[^a-z0-9\-_]/gi,'-');
    const handle=await window.showSaveFilePicker({
      suggestedName:base+'.flowstudio',
      types:[{description:'Proyecto FlowStudio',
              accept:{'application/json':['.flowstudio','.json']}}]
    });
    state.fileHandle=handle;
    await writeToHandle(handle);
  }catch(e){
    if(e.name!=='AbortError') toast('Error: '+e.message,'⚠️');
  }
}

async function saveProject(){
  if(!state.fileHandle) return saveProjectAs();
  await writeToHandle(state.fileHandle);
}

async function writeToHandle(handle){
  try{
    const w=await handle.createWritable();
    await w.write(JSON.stringify(buildProjectData(),null,2));
    await w.close();
    markClean();
    toast('Guardado: '+handle.name,'💾');
  }catch(e){
    toast('Error al guardar: '+e.message,'⚠️');
  }
}

function applyLoadedProject(text, handle){
  try{
    const data=JSON.parse(text);
    const tree=data.tree||data;
    if(!tree||!tree.name) throw new Error('Formato no reconocido');
    state.root=hydrate(tree);
    state.projectName=data.projectName||data.project?.name||tree.name;
    state.templateId=data.templateId||data.project?.template_id||state.templateId;
    state.selectedId=state.root.id;
    state.collapsed=new Set();
    state._centered=false;state.zoom=1;state.zoomX=30;state.zoomY=30;
    state.fileHandle=handle||null;
    $('#projName').value=state.projectName;
    const tpl=TEMPLATES.find(t=>t.id===state.templateId)||TEMPLATES[0];
    $('#tplIcon').textContent=tpl.icon;
    $('#tplName').textContent=tpl.name;
    buildTypeSelect();
    renderTree();
    renderView();
    markClean();
    return true;
  }catch(err){
    toast('Error al abrir: '+err.message,'⚠️');
    return false;
  }
}

// --- Botones ---
$('#btnOpen').addEventListener('click', openProjectFile);
$('#btnSave').addEventListener('click', saveProject);
$('#btnSaveAs').addEventListener('click', saveProjectAs);

$('#btnNew').addEventListener('click',()=>{
  if(state.dirty && !confirm('Tienes cambios sin guardar. ¿Crear un proyecto nuevo igualmente?')) return;
  state.fileHandle=null;
  loadTemplate(state.templateId,true);
  markDirty();
  toast('Proyecto nuevo','✨');
});

// Fallback para navegadores sin File System Access API
$('#fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ if(applyLoadedProject(r.result,null)) toast('Importado: '+f.name,'📥'); };
  r.readAsText(f);
  e.target.value='';
});

// Cambiar el nombre marca como sucio
$('#projName').addEventListener('input',e=>{
  state.projectName=e.target.value||'sin-nombre';
  markDirty();
});

// Avisar al cerrar si hay cambios sin guardar
window.addEventListener('beforeunload',e=>{
  if(state.dirty){ e.preventDefault(); e.returnValue=''; }
});

/* =====================================================================
   INICIALIZACIÓN
   ===================================================================== */
applyTheme();
loadTemplate('files',true);
renderTplList('');
updateFileStatus();
// Aplicar estado del inspector
if(state.inspectorOpen){
  $('#inspectorPanel').classList.remove('hidden');
  $('#resizerInspector').classList.remove('hidden');
}
renderInspector();
 
// Atajos de teclado
document.addEventListener('keydown',e=>{
  const cmd = e.metaKey||e.ctrlKey;
  const inField = e.target.matches('input,textarea');
  if(cmd && e.key.toLowerCase()==='s'){
    e.preventDefault();
    e.shiftKey ? saveProjectAs() : saveProject();
    return;
  }
  if(cmd && e.key.toLowerCase()==='o'){ e.preventDefault(); openProjectFile(); return; }
  if(cmd && e.key.toLowerCase()==='n'){ e.preventDefault(); $('#btnNew').click(); return; }
  if(cmd && e.key.toLowerCase()==='i'){ e.preventDefault(); toggleInspector(); return; }
  if(inField) return;
  if(e.key==='Delete'&&state.selectedId){
    const n=findNode(state.selectedId);
    if(n)delNode(n);
  }
});

// Recalcular al redimensionar
let rTimer;
window.addEventListener('resize',()=>{
  clearTimeout(rTimer);
  rTimer=setTimeout(()=>{if(state.view==='nodes'||state.view==='screens')renderView();},220);
});

</script>
</body>
</html>
